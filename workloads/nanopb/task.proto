syntax = "proto2";
package wirelink_bench;

message SetpointRequest {
  required fixed32 request_id = 1;
  required fixed32 channel = 2;
  required fixed32 value = 3;
}

message SetpointResponse {
  required fixed32 request_id = 1;
  required fixed32 status = 2;
  required fixed32 applied_value = 3;
}

message Sample {
  required fixed32 sequence = 1;
  required fixed32 sample_tick = 2;
  required fixed32 value = 3;
  required fixed32 flags = 4;
}
